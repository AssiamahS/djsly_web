name: DJ5ly
options:
  bundleIdPrefix: com.djsly
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: QGMAWHX827
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  DJ5ly:
    type: application
    platform: iOS
    sources:
      - path: DJ5ly
        excludes:
          - "Resources/web/**"
      - path: DJ5ly/Resources/web
        type: folder
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.djsly.dj5ly
      INFOPLIST_FILE: DJ5ly/Resources/Info.plist
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SUPPORTS_XR_DESIGNED_FOR: NO
      SUPPORTS_MACCATALYST: NO
    info:
      path: DJ5ly/Resources/Info.plist
      properties:
        CFBundleName: DJ5ly
        CFBundleDisplayName: DJ5ly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: "DJ5ly looks for your Mac's stem server on the local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
